version: '3.8'
services:
  backend:
    build:
      context: ./backend
    container_name: priority-backend
    env_file:
      - ./backend/.env.example
    ports:
      - '5000:5000'
    depends_on:
      - mongo
      - redis
      - ai-service
    networks:
      - priority-network

  frontend:
    build:
      context: ./frontend
    container_name: priority-frontend
    ports:
      - '3000:80'
    depends_on:
      - backend
    networks:
      - priority-network

  mongo:
    image: mongo:6.0
    container_name: priority-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    networks:
      - priority-network

  redis:
    image: redis:7.0-alpine
    container_name: priority-redis
    ports:
      - '6379:6379'
    networks:
      - priority-network

  ai-service:
    build:
      context: ./ai-service
    container_name: priority-ai-service
    env_file:
      - ./ai-service/.env.example
    ports:
      - '8000:8000'
    networks:
      - priority-network

networks:
  priority-network:
    driver: bridge

volumes:
  mongo-data:
